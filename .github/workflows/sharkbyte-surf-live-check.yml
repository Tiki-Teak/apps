name: SharkByte Surf Live Check

permissions:
  contents: write

on:
  push:
    paths:
      - "apps/SharkByte Surf - Live/**"
      - ".github/workflows/sharkbyte-surf-live-check.yml"
  workflow_dispatch:

jobs:
  pixlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pixlet
        run: |
          curl -L -o /tmp/pixlet.tar.gz https://github.com/tronbyt/pixlet/releases/download/v0.54.0/pixlet_v0.54.0_linux-amd64.tar.gz
          tar -xzf /tmp/pixlet.tar.gz -C /tmp
          sudo install /tmp/pixlet /usr/local/bin/pixlet
          pixlet version || true
      - name: Lint
        run: pixlet lint 'apps/SharkByte Surf - Live/sharkbyte_surf_live.star'
      - name: Check
        run: pixlet check 'apps/SharkByte Surf - Live/sharkbyte_surf_live.star'
      - name: Render live preview
        run: pixlet render -z 9 'apps/SharkByte Surf - Live/sharkbyte_surf_live.star'

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharkbyte-surf-live-preview
          path: "apps/SharkByte Surf - Live/sharkbyte_surf_live.webp"

      - name: Commit refreshed preview
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/SharkByte Surf - Live/sharkbyte_surf_live.webp"
          if git diff --cached --quiet; then
            echo "Preview already current."
            exit 0
          fi
          git commit -m "Update SharkByte preview [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
